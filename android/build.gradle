group 'com.gtbluesky.fusion'
version '1.0-SNAPSHOT'

// 注意：不在此处声明 buildscript{ kotlin-gradle-plugin } 或 pin kotlin 版本。
// fusion 作为 Flutter 插件子工程被编译时，Kotlin Gradle Plugin 均为 2.1.21：
//   - source 模式(android_im)：由 settings.gradle 的 beforeProject +
//     resolutionStrategy.eachDependency 把各子工程的 kotlin 件强制对齐到宿主 2.1.21；
//   - aar 模式(xmstack/.android)：由 settings.gradle 的
//     plugins{ org.jetbrains.kotlin.android version "2.1.21" } 提供。
// 若这里再 pin 1.5.30，会与 2.1.21 的 kotlin build-tools 混用 classloader，
// 触发 `NoClassDefFoundError: kotlin/enums/EnumEntriesKt`
// （EnumEntriesKt 是 Kotlin 1.9+ 才有的类）导致 transform 阶段崩溃。两种模式同理。

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.gtbluesky.fusion'
    }
    compileSdkVersion 31

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        consumerProguardFiles "consumer-rules.pro"
    }
}

dependencies {
    // 不 pin 版本：由上述两种模式的 Kotlin 2.1.21 插件链路统一解析。
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation 'androidx.appcompat:appcompat:1.3.1'
}
